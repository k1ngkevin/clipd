name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: build
        run: cargo build

      - name: run tests
        run: cargo test

      - name: run lint
        run: cargo clippy -- -D warnings

      - name: run format
        run: cargo fmt --check
