[package]
name = "clipd"
version = "0.1.0"
edition = "2024"
description = "A tui clipboard history manager for Wayland"
license = "MIT"
repository = "https://github.com/k1ngkevin/clipd"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
dirs = "5.0"
clap = { version = "4.6.4", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
nucleo-matcher = "0.3.1"
tui-input = "0.15.3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"